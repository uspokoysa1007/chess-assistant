<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="pawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="pawnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#pawnGlow)">
    <!-- Base pedestal -->
    <path d="M 12 41 C 12 39.5, 36 39.5, 36 41 L 37 43.5 C 37 44.5, 11 44.5, 11 43.5 Z" 
          fill="url(#pawnGrad)" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" />

    <!-- Lower base ring -->
    <path d="M 14.5 36.5 C 14.5 35.5, 33.5 35.5, 33.5 36.5 L 35 39.5 C 35 40.5, 13 40.5, 13 39.5 Z" 
          fill="url(#pawnGrad)" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" />

    <!-- Pawn Body / Stem -->
    <path d="M 20.5 19.5 
             C 21.5 24.5, 16.5 28.5, 16 35.5 
             C 16 36.5, 32 36.5, 32 35.5 
             C 31.5 28.5, 26.5 24.5, 27.5 19.5 Z" 
          fill="url(#pawnGrad)" stroke="#334155" stroke-width="1.6" stroke-linejoin="round" />

    <!-- Collar ring -->
    <ellipse cx="24" cy="18.5" rx="5.5" ry="1.8" 
             fill="url(#pawnGrad)" stroke="#334155" stroke-width="1.6" />

    <!-- Head / Ball -->
    <circle cx="24" cy="11.5" r="6" 
            fill="url(#pawnGrad)" stroke="#334155" stroke-width="1.6" />
            
    <!-- Soft light highlight on head -->
    <ellipse cx="22.2" cy="9.8" rx="2" ry="1.4" fill="#ffffff" opacity="0.75" />
  </g>
</svg>
